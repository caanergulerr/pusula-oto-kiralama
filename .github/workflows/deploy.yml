name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Pusula Oto to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '156.67.27.14' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            echo "🔍 [Audit] VPS üzerindeki geçmiş veriler ve loglar taranıyor..."
            grep -iE "brand|dailyPrice|model|plateNumber" /root/.pm2/logs/* 2>/dev/null | head -n 40 || true
            find / -name "*database*.sqlite*" 2>/dev/null || true
            grep -E "node|seed|cars" /root/.bash_history 2>/dev/null | tail -n 20 || true

            echo "🚀 [Deploy] VPS Güncellemesi Başlatılıyor..."
            cd /var/www/pusula-oto

            echo "🧹 [Git] Sunucu temizleniyor ve en son kodlar zorla çekiliyor..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            git pull origin main

            echo "⚙️ [Backend] Ortam değişkenleri oluşturuluyor..."
            echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\"" > backend/.env
            echo "DB_TYPE=sqlite" >> backend/.env
            echo "JWT_SECRET=\"${{ secrets.JWT_SECRET }}\"" >> backend/.env
            echo "FRONTEND_URL=https://elazigotokiralamapusula.com" >> backend/.env
            echo "APP_URL=https://elazigotokiralamapusula.com" >> backend/.env
            echo "NODE_ENV=production" >> backend/.env
            echo "GMAIL_USER=\"${{ secrets.GMAIL_USER }}\"" >> backend/.env
            echo "GMAIL_PASS=\"${{ secrets.GMAIL_PASS }}\"" >> backend/.env
            echo "PORT=3000" >> backend/.env
            echo "PAYTR_MERCHANT_ID=test_merchant_id" >> backend/.env
            echo "PAYTR_MERCHANT_KEY=test_merchant_key" >> backend/.env
            echo "PAYTR_MERCHANT_SALT=test_merchant_salt" >> backend/.env
            echo "PAYTR_TEST_MODE=1" >> backend/.env

            echo "⚙️ [Backend] Bağımlılıklar yükleniyor ve derleniyor..."
            cd backend
            mkdir -p data
            npm install
            npm run build

            echo "🎨 [Frontend] Bağımlılıklar yükleniyor ve derleniyor..."
            cd ../frontend
            npm install
            rm -rf .next
            npx next build

            echo "🔄 [PM2] Servisler yeniden başlatılıyor..."
            pm2 delete pusula-backend || true
            pm2 start /var/www/pusula-oto/backend/dist/main.js --name "pusula-backend" --cwd /var/www/pusula-oto/backend
            pm2 delete pusula-frontend || true
            pm2 start /var/www/pusula-oto/frontend/node_modules/.bin/next --name "pusula-frontend" --cwd /var/www/pusula-oto/frontend -- start -p 3001
            pm2 save
            pm2 status

            echo "✅ [Deploy] Pusula Oto Kiralama başarıyla canlıya alındı!"

