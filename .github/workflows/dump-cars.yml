name: Read Cars from VPS Database

on:
  workflow_dispatch:

jobs:
  read-db:
    name: Read cars data via Node.js
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and read cars via node
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '156.67.27.14' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== READING CARS FROM CURRENT DATABASE ==="
            cd /var/www/pusula-oto/backend
            node -e "
            const sqlite3 = require('./node_modules/sqlite3').verbose();
            const db = new sqlite3.Database('./data/database.sqlite');
            db.all('SELECT id, brand, model, year, dailyPrice, category, imageUrl, imageUrls, kmLimit, description, specs, features, plateNumber, status FROM cars ORDER BY dailyPrice ASC', [], (err, rows) => {
              if(err) { console.error('QUERY ERR:', err.message); }
              else { console.log('CAR_COUNT:', rows.length); console.log('CARS_JSON:' + JSON.stringify(rows)); }
              db.close();
            });
            " 2>&1

            echo ""
            echo "=== READING CARS FROM BACKUP DATABASE ==="
            node -e "
            const sqlite3 = require('./node_modules/sqlite3').verbose();
            const db = new sqlite3.Database('/var/www/backup/database.sqlite');
            db.all('SELECT id, brand, model, year, dailyPrice, category, imageUrl, imageUrls, kmLimit, description, specs, features, plateNumber, status FROM cars ORDER BY dailyPrice ASC', [], (err, rows) => {
              if(err) { console.error('BACKUP ERR:', err.message); }
              else { console.log('BACKUP_COUNT:', rows.length); console.log('BACKUP_JSON:' + JSON.stringify(rows)); }
              db.close();
            });
            " 2>&1
